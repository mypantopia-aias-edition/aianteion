<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPantopia - Aias Edition</title>
    <style>
        body { 
            background: radial-gradient(circle, #f4fcf8 0%, #e6f3ed 100%); 
            color: #1b4332; 
            font-family: 'Georgia', serif; 
            text-align: center; 
            padding: 15vh 20px 0 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { 
            font-size: 3.5rem; 
            color: #2d6a4f;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        p { 
            font-size: 1.4rem; 
            font-style: italic;
            color: #40916c;
            line-height: 1.6;
        }
        .island-vibes {
            font-size: 5rem;
            margin-top: 40px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to MyPantopia</h1>
        <p>The Aias Edition • Live from Salamis Island</p>
        <p>A place built step by step, honoring flow, simplicity, and natural rewards.</p>
        <div class="island-vibes">🌿🌊🌿</div>
    </div>
</body>
</html>
